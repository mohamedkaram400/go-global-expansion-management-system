services:
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: app-expansion
    ports:
      - "3000:9000"
    depends_on:
      redis:
        condition: service_started
      mongodb:
        condition: service_started
      mysql:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - expansion
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: nginx-expansion
    ports:
      - "8081:80" 
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - expansion
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/ping"]
      interval: 30s
      timeout: 10s
      retries: 3 

  mysql:
    image: mysql:8.0
    container_name: mysql-expansion
    ports:
      - "3309:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    env_file:
      - .env
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - expansion
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pqazwsx123"]
      interval: 5s
      timeout: 10s
      retries: 5

  redis:
    image: redis:alpine
    container_name: redis-expansion
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - expansion
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]

  mongodb:
    image: mongodb/mongodb-community-server:6.0-ubi8
    container_name: mongodb-expansion
    environment:
      - MONGO_INITDB_ROOT_USERNAME=user
      - MONGO_INITDB_ROOT_PASSWORD=pass
    env_file:
      - .env
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - expansion
    healthcheck:
      test: ["CMD", "mongosh", "--username", "user", "--password", "pass", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  expansion:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  mongo_data: